
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #102c46, #087e83);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 450px;
        }

        .card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background: linear-gradient(90deg, #073b55, #078b89) !important;
            color: white;
            text-align: center;
            padding: 30px 20px;
            font-size: 25px;
            font-weight: 700;
            border: none;
        }

       .card-header::before {
    content: "";
    display: block;
    background-image: url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/hospital.svg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    width: 45px;
    height: 45px;
    margin: 0 auto 10px;
    filter: brightness(0) invert(1);
}

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
            color: #34495e;
        }

        .form-control {
            padding: 12px 15px;
            border-radius: 9px;
            border: 1px solid #dce3e9;
        }

        .form-control:focus {
            border-color: #078b89;
            box-shadow: 0 0 0 3px rgba(7, 139, 137, 0.12);
        }

        .btn-primary {
            background: linear-gradient(90deg, #087e83, #09a5a0);
            border: none;
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #06666d, #078b89);
            transform: translateY(-2px);
        }

        .alert {
            border-radius: 9px;
            font-size: 14px;
        }

        .login-footer {
            text-align: center;
            color: #89959e;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-12">

            <div class="card">

                <div class="card-header">
                    Administrator Login
                </div>

                <div class="card-body">

                    <p class="text-center text-muted mb-4">
                        Welcome back! Please login to continue.
                    </p>

                    <div th:if="${param.error}"
                         class="alert alert-danger">
                        Invalid email or password.
                    </div>

                    <div th:if="${param.logout}"
                         class="alert alert-success">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">

                            <label for="username" class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <input type="hidden"
                               th:name="${_csrf?.parameterName}"
                               th:value="${_csrf?.token}">

                        <button type="submit"
                                class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Login
                        </button>

                    </form>

                    <div class="login-footer">
                        <i class="bi bi-shield-lock-fill me-1"></i>
                        Secure Administrator Access
                        <br>
                        © 2026 CareConnect
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
