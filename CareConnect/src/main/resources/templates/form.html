
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Management - CareConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h3 {
            color: #08264f;
            font-weight: bold;
        }

        .page-heading p {
            color: #718096;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            max-width: 900px;
        }

        .section-title {
            color: #08264f;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-label {
            color: #455468;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control,
        .form-select {
            padding: 11px;
            border-radius: 7px;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .btn-primary {
            background: #1761d1;
            border: none;
        }

        .btn-primary:hover {
            background: #08264f;
        }

        @media(max-width: 768px) {
            .form-card {
                padding: 20px;
            }
        }

    </style>

</head>

<body>

    <!-- COMMON SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TOPBAR -->
        <div class="topbar">

            <h4>Doctor Management</h4>

            <div>
                <i class="bi bi-bell me-3"></i>
                <i class="bi bi-person-circle me-1"></i>
                <strong>Admin</strong>
            </div>

        </div>

        <!-- PAGE HEADING -->
        <div class="page-heading">

            <h3 th:text="${doctor.id == null ? 'Add New Doctor' : 'Edit Doctor'}">
                Add New Doctor
            </h3>

            <p th:text="${doctor.id == null ?
                'Enter the doctor information below.' :
                'Update the doctor information below.'}">
                Enter the doctor's information below.
            </p>

        </div>

        <!-- DOCTOR FORM -->
        <div class="form-card">

            <h5 class="section-title">

                <i class="bi bi-person-plus me-2"></i>

                <span th:text="${doctor.id == null ?
                    'Doctor Information' : 'Update Doctor Information'}">
                    Doctor Information
                </span>

            </h5>

            <!-- FORM ACTION CHANGES BASED ON ADD OR EDIT -->
            <form th:action="${doctor.id == null ?
                  '/doctor/add' :
                  '/doctor/edit/' + doctor.id}"
                  th:object="${doctor}"
                  method="post"
                  novalidate>

                <!-- HIDDEN DOCTOR ID -->
                <input type="hidden" th:field="*{id}">

                <!-- CSRF TOKEN -->
                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="row g-3">

                    <!-- DOCTOR NAME -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Doctor Name
                        </label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Enter doctor name">

                        <div class="error-message"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <!-- EMAIL -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter email address">

                        <div class="error-message"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- SPECIALIZATION -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Specialization
                        </label>

                        <select th:field="*{specialization}"
                                class="form-select">

                            <option value="">Select Specialization</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Gynecology">Gynecology</option>
                            <option value="ENT">ENT</option>

                        </select>

                        <div class="error-message"
                             th:errors="*{specialization}">
                        </div>

                    </div>

                    <!-- QUALIFICATION -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Qualification
                        </label>

                        <input type="text"
                               th:field="*{qualification}"
                               class="form-control"
                               placeholder="Example: MBBS, MD">

                        <div class="error-message"
                             th:errors="*{qualification}">
                        </div>

                    </div>

                    <!-- EXPERIENCE -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Experience (Years)
                        </label>

                        <input type="number"
                               th:field="*{experience}"
                               class="form-control"
                               min="0"
                               placeholder="Enter experience">

                        <div class="error-message"
                             th:errors="*{experience}">
                        </div>

                    </div>

                    <!-- PHONE NUMBER -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="tel"
                               th:field="*{phoneNumber}"
                               class="form-control"
                               maxlength="15"
                               placeholder="Enter phone number">

                        <div class="error-message"
                             th:errors="*{phoneNumber}">
                        </div>

                    </div>

                    <!-- CONSULTATION FEE -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Consultation Fee (₹)
                        </label>

                        <input type="number"
                               th:field="*{consultationFee}"
                               class="form-control"
                               min="0"
                               step="0.01"
                               placeholder="Enter consultation fee">

                        <div class="error-message"
                             th:errors="*{consultationFee}">
                        </div>

                    </div>

                    <!-- STATUS -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Doctor Status
                        </label>

                        <select th:field="*{isActive}"
                                class="form-select">

                            <option value="true">Available</option>
                            <option value="false">Unavailable</option>

                        </select>

                    </div>

                </div>

                <!-- BUTTONS -->
                <div class="d-flex justify-content-end gap-2 mt-4">

                    <!-- CANCEL BUTTON -->
                    <a th:href="@{/doctor}"
                       class="btn btn-secondary">

                        <i class="bi bi-x-circle me-1"></i>
                        Cancel

                    </a>

                    <!-- SAVE / UPDATE BUTTON -->
                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-save me-1"></i>

                        <span th:text="${doctor.id == null ?
                            'Save Doctor' : 'Update Doctor'}">
                            Save Doctor
                        </span>

                    </button>

                </div>

            </form>

        </div>

        <!-- FOOTER -->
        <div class="text-center mt-4 text-secondary">

            <p>© 2026 CareConnect. All Rights Reserved.</p>

        </div>

    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
