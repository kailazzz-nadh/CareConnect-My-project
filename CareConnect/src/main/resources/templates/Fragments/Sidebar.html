
<div th:fragment="sidebar" class="sidebar">


    <!-- Logo -->
    <div class="logo">
        <i class="bi bi-heart-pulse-fill"></i>
        <span>CareConnect</span>
    </div>

    <!-- Dashboard -->
    <a th:href="@{/}"
       th:classappend="${activePage == 'dashboard'} ? 'active' : ''">

        <i class="bi bi-grid-fill"></i>
        <span>Dashboard</span>

    </a>

    <!-- Appointments -->
    <a th:href="@{/appoinment}"
       th:classappend="${activePage == 'appointment'} ? 'active' : ''">

        <i class="bi bi-calendar-check"></i>
        <span>Appointments</span>

    </a>

    <!-- Doctors -->
    <a th:href="@{/doctor}"
       th:classappend="${activePage == 'doctors'} ? 'active' : ''">

        <i class="bi bi-person-badge"></i>
        <span>Doctors</span>

    </a>

    <!-- Users -->
    <a th:href="@{/user}"
       th:classappend="${activePage == 'users'} ? 'active' : ''">

        <i class="bi bi-people-fill"></i>
        <span>Users</span>

    </a>

    <!-- Reports -->
    <a th:href="@{/report}"
       th:classappend="${activePage == 'report'} ? 'active' : ''">

        <i class="bi bi-bar-chart-fill"></i>
        <span>Reports</span>

    </a>

    <!-- Settings -->
    <a th:href="@{/admin/settings}"
       th:classappend="${activePage == 'settings'} ? 'active' : ''">

        <i class="bi bi-gear-fill"></i>
        <span>Settings</span>

    </a>

   <!-- Logout -->
<form th:action="@{/logout}" method="post" class="logout-form">

    <input type="hidden"
           th:name="${_csrf?.parameterName}"
           th:value="${_csrf?.token}">

    <button type="submit" class="sidebar-logout">

        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>

    </button>

</form>

</div>
